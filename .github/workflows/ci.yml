name: Swift Package CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: swift-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and test package
    # This package declares iOS/macOS/visionOS v27 platforms and
    # swift-tools-version 6.4, so the runner must provide an Xcode 27+
    # toolchain. The standard macos-latest image only ships Xcode 26.x
    # (Swift 6.3.3), which fails `swift package resolve` immediately, so
    # this job targets the `xcode-27` image (Xcode 27 beta default, v27
    # SDKs). The preflight step below still verifies the toolchain and
    # fails early with diagnostics if the image ever stops providing one.
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select a complete Xcode toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "Available Xcode installations:"
          find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort || true
          echo "---"
          xcodebuild -showsdks || true
          echo "---"

          selected_developer_dir=""
          selected_version="0"
          while IFS= read -r xcode_app; do
            developer_dir="$xcode_app/Contents/Developer"
            if [[ -x "$developer_dir/usr/bin/xcodebuild" ]]; then
              version="$("$developer_dir/usr/bin/xcodebuild" -version 2>/dev/null | awk '/^Xcode /{print $2; exit}' || echo 0)"
              [[ -n "$version" ]] || version="0"
              if [[ "$(printf '%s\n%s\n' "$selected_version" "$version" | sort -V | tail -n 1)" == "$version" ]]; then
                selected_version="$version"
                selected_developer_dir="$developer_dir"
              fi
            fi
          done < <(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort)

          if [[ -z "$selected_developer_dir" ]]; then
            echo "::error::No Xcode installation was found. This job must run on the 'xcode-27' image."
            exit 1
          fi

          # The package declares v27 Apple platforms, so an Xcode older
          # than 27 cannot build it even if its Swift is new enough.
          major="${selected_version%%.*}"
          if [[ "$major" -lt 27 ]]; then
            echo "::error::Selected Xcode $selected_version at $selected_developer_dir, but this package requires Xcode 27+ (v27 SDKs, Swift 6.4+). Use runs-on: xcode-27."
            exit 1
          fi

          xcode_build="$($selected_developer_dir/usr/bin/xcodebuild -version 2>/dev/null | awk '/^Build version /{print $3; exit}' || echo unknown)"
          [[ -n "$xcode_build" ]] || xcode_build="unknown"

          echo "Selected Xcode $selected_version ($xcode_build) at $selected_developer_dir"
          echo "DEVELOPER_DIR=$selected_developer_dir" >> "$GITHUB_ENV"
          echo "xcode_build=$xcode_build" >> "$GITHUB_OUTPUT"
          sudo xcode-select --switch "$selected_developer_dir"
          xcodebuild -version

          # MLX compiles generated Metal kernels. xcode-27 images can expose
          # Xcode's fallback metal executable even when the MetalToolchain
          # component is not installed; that fallback fails later with an
          # opaque CompileMetalFile error. Verify the component itself and
          # install it before SwiftPM starts compiling MLX.
          component_json="$(xcodebuild -showComponent MetalToolchain -json 2>/dev/null || true)"
          echo "MetalToolchain component status:"
          echo "$component_json"
          if ! printf '%s\n' "$component_json" | grep -q '"status"[[:space:]]*:[[:space:]]*"installed"'; then
            echo "MetalToolchain is not installed; downloading it now..."
            sudo xcodebuild -downloadComponent MetalToolchain
            component_json="$(xcodebuild -showComponent MetalToolchain -json 2>/dev/null || true)"
            echo "$component_json"
          fi
          if ! printf '%s\n' "$component_json" | grep -q '"status"[[:space:]]*:[[:space:]]*"installed"'; then
            echo "::error::MetalToolchain is unavailable after download; MLX Metal kernels cannot be compiled on this runner."
            exit 1
          fi
          metal_path="$(xcrun --find metal)"
          test -x "$metal_path"
          echo "Metal compiler: $metal_path"

          # The package requires Swift 6.4+ (swift-tools-version 6.4). Fail
          # early with a clear message instead of an opaque resolve error.
          swift_version="$(swift --version 2>&1 | head -n 1)"
          echo "Swift toolchain: $swift_version"
          if ! printf '%s\n' "$swift_version" | grep -Eq 'Swift version (6\.([4-9]|[1-9][0-9])|[7-9])'; then
            echo "::error::Selected Xcode provides $swift_version but this package requires Swift 6.4+."
            exit 1
          fi

          # The package declares v27 Apple platforms. Confirm the SDKs exist.
          sdks="$(xcodebuild -showsdks 2>/dev/null || true)"
          echo "$sdks"
          for sdk in macosx27.0 iphoneos27.0 xros27.0; do
            if ! printf '%s\n' "$sdks" | grep -q "$sdk"; then
              echo "::error::Expected SDK $sdk not listed by xcodebuild -showsdks; the selected Xcode cannot build the v27 platform targets."
              exit 1
            fi
          done

      - name: Show toolchain
        run: |
          swift --version
          xcrun --find metal

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-xcode-${{ steps.toolchain.outputs.xcode_build }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ steps.toolchain.outputs.xcode_build }}-spm-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Validate package description
        run: swift package dump-package >/dev/null

      - name: Build all products
        run: swift build -j 2

      - name: Run Swift Testing suite
        run: swift test -j 2

      - name: Verify product dependency scope
        run: swift Tools/verify-product-scope.swift

      - name: Verify dependency license evidence
        run: swift Tools/verify-dependency-licenses.swift

      - name: Verify competitor scorecard links and structure
        run: swift Tools/verify-competitor-scorecard.swift

      - name: Check whitespace
        run: git diff --check
