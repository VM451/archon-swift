name: Swift Package CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: swift-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and test package
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select a complete Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          selected_developer_dir=""
          while IFS= read -r xcode_app; do
            developer_dir="$xcode_app/Contents/Developer"
            if [[ -x "$developer_dir/usr/bin/xcodebuild" && -x "$developer_dir/Toolchains/XcodeDefault.xctoolchain/usr/bin/metal" ]]; then
              selected_developer_dir="$developer_dir"
            fi
          done < <(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort)

          if [[ -z "$selected_developer_dir" ]]; then
            echo "::error::No complete Xcode installation with a usable Metal compiler was found."
            exit 1
          fi

          echo "DEVELOPER_DIR=$selected_developer_dir" >> "$GITHUB_ENV"
          sudo xcode-select --switch "$selected_developer_dir"
          xcodebuild -version
          metal_path="$(xcrun --find metal)"
          test -x "$metal_path"

      - name: Show toolchain
        run: |
          swift --version
          xcrun --find metal

      - name: Resolve dependencies
        run: swift package resolve

      - name: Validate package description
        run: swift package dump-package >/dev/null

      - name: Build all products
        run: swift build -j 2

      - name: Run Swift Testing suite
        run: swift test -j 2

      - name: Verify product dependency scope
        run: swift Tools/verify-product-scope.swift

      - name: Verify dependency license evidence
        run: swift Tools/verify-dependency-licenses.swift

      - name: Verify competitor scorecard links and structure
        run: swift Tools/verify-competitor-scorecard.swift

      - name: Check whitespace
        run: git diff --check
